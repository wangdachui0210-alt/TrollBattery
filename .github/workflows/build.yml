name: Build TrollBattery IPA

# 推送到 main/master 即自动出包；也可在 Actions 页面手动触发。
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build app without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project TrollBattery.xcodeproj \
            -scheme TrollBattery \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Locate built app
        id: locate
        run: |
          APP=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::未找到编译产物 .app"
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "产物路径：$APP"
          ls -l "$APP"
          echo "--- PlugIns ---"
          ls -l "$APP/PlugIns" || echo "::warning::PlugIns 目录不存在"

      - name: Inject entitlements (ldid)
        run: |
          brew install ldid || true
          APP="${{ steps.locate.outputs.app }}"
          if ! command -v ldid >/dev/null 2>&1; then
            echo "::error::ldid 不可用，无法注入 entitlements"
            exit 1
          fi

          # 主程序
          ldid -STrollBattery/TrollBattery.entitlements "$APP/TrollBattery"
          echo "=== 主程序 entitlements ==="
          ldid -e "$APP/TrollBattery" || true

          # 嵌入式 App Extension（灵动岛 Widget）必须同样注入，否则系统不会加载
          if [ -d "$APP/PlugIns" ]; then
            for EXT in "$APP/PlugIns"/*.appex; do
              [ -e "$EXT" ] || continue
              EXT_NAME=$(basename "$EXT" .appex)
              ldid -STrollBatteryWidget/TrollBatteryWidget.entitlements "$EXT/$EXT_NAME"
              echo "=== 扩展 $EXT_NAME entitlements ==="
              ldid -e "$EXT/$EXT_NAME" || true
            done
          else
            echo "::error::未找到 PlugIns 目录，Widget Extension 未被打包"
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP="${{ steps.locate.outputs.app }}"
          rm -rf Payload TrollBattery.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TrollBattery.ipa Payload
          rm -rf Payload
          ls -lh TrollBattery.ipa
          echo "IPA 大小：$(du -h TrollBattery.ipa | cut -f1)"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollBattery-unsigned-ipa
          path: TrollBattery.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA to Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="latest"
          fi
          echo "release tag: $TAG"
          gh release create "$TAG" TrollBattery.ipa \
            --title "TrollBattery $TAG" \
            --notes "TrollStore 用未签名 IPA。下载后直接用 TrollStore 打开安装。" \
            || gh release upload "$TAG" TrollBattery.ipa --clobber
